[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miragegrid"
version = "0.2.0"
description = "Session assignment and Cap-7 mesh DNS factory for AZ-OS. Not a VPN, not an anonymity network, and not AZVPN. Hosted packet forwarding is false. Author Aziel Eliab."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "mesh",
    "session",
    "cap-7",
    "privacy",
    "az-os",
    "miragegrid",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
miragegrid = "miragegrid.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/miragegrid"
Download = "https://github.com/AzielEliab/miragegrid/releases"
Issues = "https://github.com/AzielEliab/miragegrid/issues"

[tool.setuptools.packages.find]
include = ["miragegrid*"]

[tool.setuptools.package-data]
miragegrid = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
